<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Тест</title>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=60445215-6d3a-4f88-87fe-8d52b72e5bc9"
        type="text/javascript"></script>
    <script src="https://geocode-maps.yandex.ru/1.x/?apikey=5a39211b-dd9d-482d-abf7-95a52bd60110" type="text/javascript"></script>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #searchBox {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 340px;
            z-index: 1000;
        }

        #search {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        #search:focus {
            border-color: #fdd734;
        }

        #search.input_error,
        #search.input_error:focus {
            border-color: #f33;
        }

        #notice {
            color: #f33;
            font-size: 13px;
            margin: 6px 0 0 4px;
            display: none;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div id="searchBox">
        <input id="search" placeholder="Адрес или объект" autocomplete="off">
        <p id="notice">Адрес не найден</p>
    </div>
    <script type="text/javascript">
        // var map = null;
        var API_KEY = '5a39211b-dd9d-482d-abf7-95a52bd60110';
        var userPlacemark = null;
        var userPoint = null;
        var kudaPoint = null;
        var currentRoute = null;
        var map, mark;
        ymaps.ready(init);

        function init() {
            map = new ymaps.Map('map', {
                center: [55.75, 37.65],
                zoom: 12,
                controls: ['zoomControl']
            });
            

            var suggestView = new ymaps.SuggestView('search');

            suggestView.events.add('select', function (e) {
                var address = e.get('item').value;
                console.log('Выбран адрес:', address);
                // geocodeViaYmaps(address);
                window.chrome.webview.postMessage(address);
            });


        }
            function geocodeViaYmaps(address) {
                console.log('Запускаю ymaps.geocode...');

                ymaps.geocode(address, { results: 1 })
                    .then(function (res) {
                        console.log('Геокод ответил:', res);

                        var obj = res.geoObjects.get(0);
                        if (!obj) {
                            console.warn('Адрес не найден');
                            return;
                        }

                        var coords = obj.geometry.getCoordinates();
                        var fullAddress = obj.getAddressLine();

                        // Проверка точности
                        var precision = obj.properties.get(
                            'metaDataProperty.GeocoderMetaData.precision'
                        );
                        console.log('Точность:', precision);
                        console.log('Координаты:', coords);
                        console.log('Полный адрес:', fullAddress);

                        showMark(coords, fullAddress);
                    })
                    .catch(function (err) {
                        console.error('Ошибка ymaps.geocode:', err);
                    });
            }
        function geocodeViaHttp(address) {
            var url = 'https://geocode-maps.yandex.ru/1.x/'
                + '?apikey=' + API_KEY
                + '&geocode=' + encodeURIComponent(address)
                + '&format=json'
                + '&results=1';

            fetch(url)
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var members = data.response.GeoObjectCollection.featureMember;
                    if (!members.length) {
                        console.warn('Адрес не найден');
                        return;
                    }

                    var obj = members[0].GeoObject;
                    var pos = obj.Point.pos.split(' ');
                    var lon = parseFloat(pos[0]);
                    var lat = parseFloat(pos[1]);
                    var fullAddress = obj.metaDataProperty.GeocoderMetaData.text;

                    console.log('Координаты:', lat, lon);
                    showMark([lat, lon], fullAddress);
                })
                .catch(function (err) {
                    console.error('Ошибка геокодера:', err);
                });
        }

        function showMark(coords, address) {
            console.log(coords)
            console.log(address)
            if (mark) map.geoObjects.remove(mark);
            mark = new ymaps.Placemark(coords, {
                balloonContent: address
            }, {
                preset: 'islands#redIcon'
            });
            map.geoObjects.add(mark);
            map.setCenter(coords, 16);
            mark.balloon.open();
        }


        function buildRoute() {
            console.log([userPoint, kudaPoint]);
            ymaps.route([userPoint, kudaPoint], {
                routingMode: 'auto',        // 'auto', 'pedestrian', 'masstransit'
                mapStateAutoApply: true     // автоматически подгонит карту под маршрут
            }).then(function (route) {
                // Убираем старый маршрут, если был
                if (currentRoute) map.geoObjects.remove(currentRoute);
                currentRoute = route;
                map.geoObjects.add(route);

                // Получаем данные
                var distanceMeters = route.getLength();   // метры
                var timeSeconds = route.getTime();         // секунды

                var distanceKm = (distanceMeters / 1000).toFixed(2);
                var timeMin = Math.round(timeSeconds / 60);

                console.log('Расстояние:', distanceKm, 'км');
                console.log('Время:', timeMin, 'мин');

                // Передаём дальше — расчёт стоимости
                // calculatePrice(distanceKm, timeMin);
            }).catch(function (err) {
                console.error('Ошибка построения маршрута:', err);
            });
        }

        window.showMarkC = function (lat, lon, address) {
            console.log('showMarkC:', lat, lon, address);
            
            var coords = [lat, lon];
            
            if (mark) map.geoObjects.remove(mark);
            mark = new ymaps.Placemark(coords, {
                balloonContent: address
            }, {
                preset: 'islands#redIcon'
            });
            map.geoObjects.add(mark);
            map.setCenter(coords, 16);
            mark.balloon.open();
            kudaPoint = coords;
        }; 


        window.setUserLocation = function (lat, lon) {
            console.log('setUserLocation вызван:', lat, lon);

            if (!map) {
                console.warn('Карта ещё не инициализирована');
                return;
            }

            var coords = [lat, lon];
            userPoint = coords;
            if (!userPlacemark) {
                userPlacemark = new ymaps.Placemark(coords, {
                    hintContent: 'Вы здесь',
                    balloonContent: 'Ваше местоположение'
                }, {
                    preset: 'islands#bluePersonIcon'
                });
                map.geoObjects.add(userPlacemark);
            } else {
                userPlacemark.geometry.setCoordinates(coords);
            }

            map.setCenter(coords, 15);
        }



    </script>

</body>

</html>
