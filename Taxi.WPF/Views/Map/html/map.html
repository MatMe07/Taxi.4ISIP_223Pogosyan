    <script>

        function successHandler(position) {
            // console.log("Широта: ", position.coords.latitude);
            // console.log("Долгота: ", position.coords.longitude);
            // console.info(addressOtkudaCoord);
            if (addressOtkudaCoord == null) {
                addressUser = { lat: position.coords.latitude, lon: position.coords.longitude };
                // console.info(position);
                postToHost({ type: 'destinationOtkudaCoord', address_coord: [position.coords.latitude, position.coords.longitude] });

                // console.info("posUser: " + JSON.stringify(addressUser));
            }
            else {
                addressUser = { lat: addressOtkudaCoord.lat, lon: addressOtkudaCoord.lon };
                // console.info("posOtkuda: " + JSON.stringify(addressUser));

            }

        };
        function errorHandler(error) {
            // console.log(error.message);
            if (addressOtkudaCoord == null)
                addressUser = { lat: 55.755864, lon: 37.617698 }
            else
                addressUser = { lat: addressOtkudaCoord.lat, lon: addressOtkudaCoord.lon };
        }

        const geolocation = navigator.geolocation;
        const watchID = geolocation.watchPosition(successHandler, errorHandler);
    </script>
