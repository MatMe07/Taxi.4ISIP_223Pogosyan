<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="200" height="200">
  <!-- Задняя карта (голубая) -->
  <g>
    <!-- Основа карты -->
    <rect x="38" y="25" width="64" height="54" rx="8" fill="#55b5ef"/>
    <!-- Темная магнитная полоса -->
    <rect x="38" y="35" width="64" height="9" fill="#2d3e44"/>
    <!-- Светлая полоса для подписи -->
    <rect x="48" y="53" width="44" height="10" fill="#e3f4fc"/>
  </g>

  <!-- Передняя карта (синяя) -->
  <g>
    <!-- Основа карты -->
    <rect x="18" y="54" width="67" height="50" rx="8" fill="#4145bc"/>
    <!-- Желтый чип -->
    <rect x="67" y="64" width="12" height="12" rx="1.5" fill="#ffb300"/>
    <!-- Желтые точки/цифры внизу -->
    <rect x="28" y="88" width="9" height="4.5" rx="1" fill="#ffb300"/>
    <rect x="42" y="88" width="9" height="4.5" rx="1" fill="#ffb300"/>
    <rect x="56" y="88" width="9" height="4.5" rx="1" fill="#ffb300"/>
    <rect x="70" y="88" width="9" height="4.5" rx="1" fill="#ffb300"/>
  </g>
</svg>