<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Тест</title>
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=60445215-6d3a-4f88-87fe-8d52b72e5bc9"
        type="text/javascript"></script>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #searchBox {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 340px;
            z-index: 1000;
        }

        #search {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        #search:focus {
            border-color: #fdd734;
        }

        #search.input_error,
        #search.input_error:focus {
            border-color: #f33;
        }

        #notice {
            color: #f33;
            font-size: 13px;
            margin: 6px 0 0 4px;
            display: none;
        }

        #notice.visible {
            display: block;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div id="searchBox">
        <input id="search" placeholder="Адрес, объект — или кликните по карте" autocomplete="off">
        <p id="notice"></p>
    </div>
    <script type="text/javascript">
        var map = null;
        var suggestView = null;
        // Нарисованный маршрут и метки точек.
        var routeLine = null;
        var points = { from: null, to: null };

        ymaps.ready(init);

        function postToHost(message) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(JSON.stringify(message));
            } else {
                console.log('[-> C#]', JSON.stringify(message));
            }
        }

        function showNotice(text) {
            var notice = document.getElementById('notice');
            notice.textContent = text;
            notice.classList.add('visible');
            document.getElementById('search').classList.add('input_error');
        }

        function hideNotice() {
            var notice = document.getElementById('notice');
            notice.textContent = '';
            notice.classList.remove('visible');
            document.getElementById('search').classList.remove('input_error');
        }

        function init() {
            map = new ymaps.Map('map', {
                center: [55.75, 37.65],
                zoom: 12
            });

            map.controls.add('zoomControl', {
                position: {
                    right: 10,
                    bottom: 10
                }
            });

            suggestView = new ymaps.SuggestView('search');
            suggestView.events.add('select', function (e) {
                hideNotice();
                // Геокодирование и маршрут делает C#, он вернёт результат через setPoint/showRoute.
                postToHost({ type: 'destinationSelected', address: e.get('item').value });
            });

            // Вторую точку можно поставить кликом по карте.
            // map.events.add('click', function (e) {
            //     // Клик по метке или линии маршрута точку не переставляет.
            //     if (e.get('target')) {
            //         return;
            //     }

            //     var coords = e.get('coords');
            //     if (!coords || coords.length < 2 ||
            //         !isFinite(coords[0]) || !isFinite(coords[1])) {
            //         return;
            //     }

            //     // coords из API уже в порядке [широта, долгота].
            //     postToHost({ type: 'mapClicked', lat: coords[0], lon: coords[1] });
            // });

            // Сообщаем C#, что карта готова - он поставит точку "Откуда".
            postToHost({ type: 'ready' });
        }

        function applyPoint(which, coords, address) {
            var pm = new ymaps.Placemark(coords, {
                hintContent: address,
                balloonContent: address
            }, {
                preset: which === 'from' ? 'islands#bluePersonIcon' : 'islands#redCircleDotIcon',
                zIndex: which === 'from' ? 500 : 600
            });

            pm.properties.set('hint', address);

            if (points[which]) {
                map.geoObjects.remove(points[which]);
            }
            points[which] = pm;
            map.geoObjects.add(pm);

            if (!routeLine) {
                map.setCenter(coords, 15, { duration: 300 });
            }
        }


        window.showRoute = function (coords, from, to) {
            if (!map) {
                console.warn('Карта ещё не инициализирована');
                return;
            }
                console.info('Вызвана функция showRoute');
                console.log(coords);



            hideNotice();

            var line = [];

            if (coords && coords.length) {
                for (var i = 0; i < coords.length; i++) {
                    var p = coords[i];
                    if (!p || p.length < 2 || !isFinite(p[0]) || !isFinite(p[1])) {
                        continue;
                    }
                    line.push(p);
                }
            }

            if (line.length < 2) {
                console.warn('Геометрия не получена, рисуем прямую между точками');
                line = [from, to];
            }

            if (routeLine) {
                map.geoObjects.remove(routeLine);
            }

            routeLine = new ymaps.Polyline(line, {
                strokeColor: '#0a7cff',
                strokeWidth: 20,
                // strokeOpacity: 0.85,
                // zIndex: 400,
                // balloonContentHeader: 'Маршрут',
                // balloonContentBody:
                //     '<b>Расстояние:</b> ' + formatDistance(distance) + '<br/>' +
                //     '<b>Время в пути:</b> ' + formatDuration(duration) + '<br/>' +
                //     '<span style="font-weight: bold; font-style: italic">Стоимость поездки: ' + price + ' р.</span>'
            });

            map.geoObjects.add(routeLine);
            map.setBounds(ymaps.geometry.bounds.fromCoordinates(line), {
                checkZoomRange: true,
                duration: 300
            });

            routeLine.balloon.open();
        };

        window.setPoint = function (which, lat, lon, address) {
            hideNotice();
            if (!map) {
                console.warn('Карта ещё не инициализирована');
                return;
            }
            if (which !== 'from' && which !== 'to') {
                console.warn('Неизвестная точка:', which);
                return;
            }
            applyPoint(which, [lat, lon], address);
        };

        window.showNotice = function (text) {
            showNotice(text);
        };
    </script>

</body>

</html>
